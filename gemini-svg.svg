<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220">
  <defs>
    <!-- Warm Dark Theme Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0914"/>
      <stop offset="50%" stop-color="#161224"/>
      <stop offset="100%" stop-color="#0e0a17"/>
    </linearGradient>

    <!-- Moon Corona Glow Backdrop -->
    <radialGradient id="moon-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89b4f8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#5383e8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5383e8" stop-opacity="0"/>
    </radialGradient>

    <!-- Full Blue Moon Base Gradient -->
    <radialGradient id="moon-base" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="40%" stop-color="#b4d0ff"/>
      <stop offset="75%" stop-color="#6f9ee8"/>
      <stop offset="100%" stop-color="#3b62a4"/>
    </radialGradient>

    <!-- Moon Crater Texture Gradient -->
    <radialGradient id="crater-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4668ab" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#243b66" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Cosmic Background Nebulae -->
    <radialGradient id="nebula-1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#89b4f8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#89b4f8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#c0caf5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c0caf5" stop-opacity="0"/>
    </radialGradient>

    <!-- Classic Swirling Corner Filigree -->
    <g id="filigree">
      <path d="M 12,85 L 12,12 L 85,12 M 18,85 L 18,18 L 85,18" stroke="#89b4f8" stroke-width="1.5" fill="none" opacity="0.85"/>
      <path d="M 18,18 C 32,38 52,20 70,32 C 82,40 65,58 48,42 C 32,26 55,8 75,18" stroke="#89b4f8" stroke-width="1.5" fill="none" opacity="0.8"/>
      <path d="M 12,12 C 28,28 35,48 50,32 C 60,20 42,8 28,20 C 18,28 30,42 42,32" stroke="#c0caf5" stroke-width="1.2" fill="none" opacity="0.75"/>
      <path d="M 18,85 C 30,70 45,80 35,60 C 25,45 10,65 22,78" stroke="#89b4f8" stroke-width="1.2" fill="none" opacity="0.8"/>
      <path d="M 85,18 C 70,30 80,45 60,35 C 45,25 65,10 78,22" stroke="#89b4f8" stroke-width="1.2" fill="none" opacity="0.8"/>
      <circle cx="88" cy="18" r="2.5" fill="#89b4f8"/>
      <circle cx="18" cy="88" r="2.5" fill="#89b4f8"/>
      <circle cx="48" cy="48" r="2" fill="#c0caf5"/>
    </g>
  </defs>

  <!-- Sharp 90° Corner Rectangular Base (Zero Border Radius) -->
  <rect width="100%" height="100%" fill="url(#bg)" stroke="#2d2238" stroke-width="2"/>

  <!-- Cosmic Background Nebulae -->
  <rect width="100%" height="100%" fill="url(#nebula-1)"/>
  <rect width="100%" height="100%" fill="url(#nebula-2)"/>

  <!-- Dense Realistic Starfield -->
  <g opacity="0.85">
    <circle cx="45" cy="35" r="0.8" fill="#e2e8f0" opacity="0.6"/>
    <circle cx="95" cy="140" r="1.1" fill="#e2e8f0" opacity="0.8"/>
    <circle cx="130" cy="45" r="0.7" fill="#ffffff" opacity="0.5"/>
    <circle cx="170" cy="175" r="1.3" fill="#d0e1ff" opacity="0.9"/>
    <circle cx="220" cy="95" r="0.9" fill="#ffffff" opacity="0.7"/>
    <circle cx="260" cy="30" r="1.4" fill="#e2e8f0" opacity="0.85"/>
    <circle cx="310" cy="160" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="340" cy="80" r="1.2" fill="#d0e1ff" opacity="0.9"/>
    <circle cx="380" cy="190" r="0.7" fill="#ffffff" opacity="0.5"/>
    <circle cx="420" cy="40" r="1.5" fill="#e2e8f0" opacity="0.95"/>
    <circle cx="450" cy="170" r="0.9" fill="#ffffff" opacity="0.7"/>
    <circle cx="550" cy="35" r="1.1" fill="#d0e1ff" opacity="0.8"/>
    <circle cx="580" cy="180" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="620" cy="50" r="1.4" fill="#e2e8f0" opacity="0.9"/>
    <circle cx="660" cy="155" r="0.7" fill="#ffffff" opacity="0.5"/>
    <circle cx="700" cy="30" r="1.2" fill="#d0e1ff" opacity="0.85"/>
    <circle cx="740" cy="185" r="1.6" fill="#e2e8f0" opacity="0.95"/>
    <circle cx="790" cy="85" r="0.9" fill="#ffffff" opacity="0.7"/>
    <circle cx="830" cy="40" r="1.3" fill="#d0e1ff" opacity="0.8"/>
    <circle cx="870" cy="165" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="910" cy="90" r="1.5" fill="#e2e8f0" opacity="0.9"/>
    <circle cx="950" cy="45" r="1.0" fill="#ffffff" opacity="0.75"/>
    <circle cx="965" cy="175" r="0.7" fill="#d0e1ff" opacity="0.5"/>

    <!-- Diffraction Cross Sparkle Stars -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.85">
      <path d="M 150,55 L 150,65 M 145,60 L 155,60"/>
      <path d="M 340,80 L 340,90 M 335,85 L 345,85"/>
      <path d="M 670,40 L 670,50 M 665,45 L 675,45"/>
      <path d="M 850,145 L 850,155 M 845,150 L 855,150"/>
    </g>
  </g>

  <!-- Moon Atmosphere Corona Glow -->
  <circle cx="500" cy="78" r="120" fill="url(#moon-aura)"/>

  <!-- Detailed Realistic Full Blue Moon -->
  <g transform="translate(500, 75)">
    <circle cx="0" cy="0" r="48" fill="url(#moon-base)"/>

    <!-- Lunar Maria & Craters -->
    <g fill="url(#crater-grad)" opacity="0.7">
      <path d="M -18,-24 Q -6,-34 12,-26 Q 26,-18 22,-2 Q 6,-10 -14,-14 Z"/>
      <path d="M -34,-10 Q -15,-14 -10,6 Q -18,22 -31,14 Q -42,2 -34,-10 Z"/>
      <path d="M 6,2 Q 22,-2 34,10 Q 38,26 22,34 Q 6,26 6,2 Z"/>
      <path d="M -14,14 Q 2,10 12,26 Q 2,38 -12,36 Q -26,30 -14,14 Z"/>
      <circle cx="-22" cy="18" r="6"/>
      <circle cx="14" cy="-14" r="5"/>
      <circle cx="26" cy="12" r="7"/>
      <circle cx="-6" cy="26" r="4"/>
      <circle cx="-2" cy="-22" r="4"/>
      <circle cx="32" cy="-6" r="3"/>
      <circle cx="-30" cy="-18" r="3.5"/>
      <circle cx="2" cy="2" r="5"/>
    </g>

    <g stroke="#ffffff" stroke-width="0.6" fill="none" opacity="0.45">
      <circle cx="-22" cy="18" r="6.2"/>
      <circle cx="14" cy="-14" r="5.2"/>
      <circle cx="26" cy="12" r="7.2"/>
      <circle cx="-6" cy="26" r="4.2"/>
      <circle cx="2" cy="2" r="5.2"/>
    </g>
  </g>

  <!-- Replicated Filigree across 4 Sharp Corners -->
  <use href="#filigree"/>
  <use href="#filigree" transform="translate(1000, 0) scale(-1, 1)"/>
  <use href="#filigree" transform="translate(0, 220) scale(1, -1)"/>
  <use href="#filigree" transform="translate(1000, 220) scale(-1, -1)"/>

  <!-- Elegant Slim Serif Typography -->
  <g id="center-title">
    <!-- Drop Shadow for Legibility -->
    <text x="500" y="110" text-anchor="middle" fill="#0b0914" font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" font-size="35" font-weight="400" letter-spacing="7" opacity="0.85">AWAB AL BERMAWY</text>
    <!-- Crisp Light Core Name -->
    <text x="500" y="108" text-anchor="middle" fill="#f0f5ff" font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" font-size="35" font-weight="400" letter-spacing="7">AWAB AL BERMAWY</text>
    <!-- Subtitle -->
    <text x="500" y="142" text-anchor="middle" fill="#89b4f8" font-family="'Segoe UI', 'Trebuchet MS', sans-serif" font-size="12" font-weight="400" letter-spacing="8">SOFTWARE ENGINEER • AI ARCHITECT</text>
  </g>
</svg>
